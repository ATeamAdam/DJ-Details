<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A tool for scraping and updating DJ data from various sources.">
  <title>DJ Finder</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.7.1/css/buttons.dataTables.min.css">
  <link rel="icon" href="/assets/favicon.webp" type="image/png">
</head>
<body>
  <header>
    <img src="/assets/favicon.webp" id="headerIcon"/> 
    <h1>DJ Finder</h1>
  </header>
  <div id="loadingScreen">
    <div id="loadingText">Loading...</div>
    <img id="loadingGif" src="/assets/Loader.gif" alt="Loading">
    <div id="waitText">DJ Finder</div>
  </div>
  <main>
    <section id="djStats" aria-labelledby="djStatsHeading">
      <h2 id="djStatsHeading">DJ Stats</h2>
      <p>Total DJs: <span id="totalDJs">0</span></p>
      <p>DJs with Social Media URLs: <span id="searchableDJs">0</span></p>
      <p>DJs with Emails: <span id="djsWithEmailsCount">0</span></p>
    </section>
    <section aria-labelledby="pipelineSectionHeading">
      <h2 id="pipelineSectionHeading">Full Run</h2>
      <label for="startLetter">Start from letter:</label>
      <input type="text" id="startLetter" maxlength="1" value="a">
      <button id="togglePipeline">Start Full Run</button>
                <span id="pipelineTimer">00:00:00</span>
                <span id="lastRunDuration">Last full run: not yet completed</span>
                <span id="pipelineSpeed">Current speed: not scanning</span>
      <div class="progress">
        <div class="progress-bar" id="pipelineProgress" style="width: 0%;">Idle</div>
      </div>
      <textarea id="pipelineOutput" readonly aria-live="polite"></textarea>
    </section>
    <section aria-labelledby="filterSectionHeading">
      <h2 id="filterSectionHeading">Browse and Filter DJs</h2>
      <input type="text" id="searchBox" placeholder="Search...">
      <button id="filterDJs">Filter</button>
      <div id="djResults"></div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/1.7.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.print.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.flash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
  <script src="/script.js"></script>
</body>
</html>
